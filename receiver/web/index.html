<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"/><meta name="color-scheme" content="dark"/><title>AutoPlay</title><link rel="stylesheet" href="/src/style.css"/><noscript><style>#browser-check{display:block!important}</style></noscript></head>
<body><section id="browser-check" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;background:#000;color:#fff;overflow:auto;padding:1.5em 1.2em;font:clamp(18px,1.9vmin,26px)/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif;box-sizing:border-box">
<h1 id="browser-check-title" style="font-size:1.6em;line-height:1.2;margin:0 0 .5em">浏览器检测 / Browser check</h1><p id="browser-check-note" style="font-size:1.1em;margin:0 0 .6em">正在检测 / Checking…</p><noscript>此浏览器禁用了 JavaScript，无法使用 CarPlay。 / JavaScript is off in this browser; CarPlay cannot be shown.</noscript><p id="browser-check-advice" style="color:rgba(235,235,245,.72);margin:0 0 1em"></p><button id="browser-check-continue" disabled style="min-height:3.5rem;padding:.6em 1.2em;font:inherit;font-size:1.1em;font-weight:600;border:0;border-radius:.75rem;background:#0066D6;color:#fff">…</button><details style="margin-top:1.2em;color:rgba(235,235,245,.72)"><summary id="browser-check-details-title" style="cursor:pointer;min-height:2.75rem;display:flex;align-items:center">技术详情 / Technical details</summary><ul id="browser-check-list" style="padding-left:1.2em;font-size:.9em"></ul><p id="browser-check-agent" style="word-wrap:break-word;font-size:.8em"></p></details></section><script src="./browser-check.js"></script><main id="app">
  <div id="screen-container"><div id="surface"><canvas id="screen" width="1280" height="720" aria-label="CarPlay" inert></canvas></div></div>
  <div id="overlay" role="status"><div class="welcome">
    <h1 data-i18n="brand">AutoPlay</h1>
    <p class="status"><span class="spinner" aria-hidden="true"></span><span id="connection-text"></span></p>
    <p id="connection-hint"></p>
    <div class="group actions">
      <a id="box-link" class="cell" href="/" hidden><span class="tile green"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.8 5.2h2.4"/></svg></span><span class="main"><b data-i18n="boxLink"></b><span data-i18n="boxLinkHint"></span></span><span class="chev"></span></a>
      <button id="btn-settings" class="cell" type="button" aria-haspopup="dialog" aria-controls="settings"><span class="tile gray"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span class="main"><b data-i18n="playerSettings"></b></span><span class="chev"></span></button>
      <button id="welcome-fullscreen" class="cell" type="button"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></span><span class="main"><b id="welcome-fullscreen-text"></b><span id="welcome-fullscreen-hint"></span></span></button>
    </div>
  </div></div>
  <div id="recovering" role="status" hidden><div class="notice"><span class="spinner" aria-hidden="true"></span><span id="recovering-text"></span></div></div>
  <div id="toast" class="capsule" role="status" hidden></div>
  <div id="debug-hud" aria-hidden="true" hidden></div>
  <div id="error-banner" role="alert" hidden><b data-i18n="error"></b><details><summary data-i18n="technical"></summary><p id="error-text"></p></details><button id="dismiss-error" class="text" data-i18n="close"></button></div>
</main>
<dialog id="settings" aria-labelledby="settings-title">
  <header><h2 id="settings-title" data-i18n="settings" tabindex="-1" autofocus></h2><button id="btn-close" class="text" type="button" data-i18n="done"></button></header>
  <div id="settings-notices" class="settings-notices"></div>
  <div class="settings-layout">
    <nav class="settings-nav" aria-labelledby="settings-nav-label"><span id="settings-nav-label" class="sr" data-i18n="settingsNav"></span><button id="nav-general" type="button" aria-controls="settings-general" aria-current="page" data-settings-page="general"><span class="tile gray"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span data-i18n="commonTab"></span></button>
<button id="nav-display" type="button" aria-controls="settings-display" aria-current="false" data-settings-page="display"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg></span><span data-i18n="displayTab"></span></button>
<button id="nav-connection" type="button" aria-controls="settings-connection" aria-current="false" data-settings-page="connection"><span class="tile green"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10a11 11 0 0 1 15 0M7.8 13.5a6.5 6.5 0 0 1 8.4 0"/><circle cx="12" cy="17.5" r="1.3" fill="currentColor" stroke="none"/></svg></span><span data-i18n="supportTab"></span></button></nav>
    <div class="settings-body">
      <section id="settings-general" class="settings-page" aria-labelledby="nav-general" data-settings-content="general">
        <h3 class="group-title" data-i18n="appearance"></h3>
        <div class="group"><button class="cell select-row" type="button" data-picker="night-mode" aria-haspopup="dialog"><span class="tile indigo"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/></svg></span><span class="main"><b data-i18n="nightMode"></b></span><span class="value"></span><span class="chev"></span></button><select id="night-mode" hidden tabindex="-1"><option value="schedule" data-i18n="nightSchedule"></option><option value="system" data-i18n="nightSystem"></option><option value="day" data-i18n="nightDay"></option><option value="night" data-i18n="nightNight"></option></select>
<button class="cell select-row" type="button" data-picker="language" aria-haspopup="dialog"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5s1.3-6.1 3.9-8.5z"/></svg></span><span class="main"><b data-i18n="language"></b></span><span class="value"></span><span class="chev"></span></button><select id="language" hidden tabindex="-1"><option value="zh">简体中文</option><option value="en">English</option></select></div>
      </section>
      <section id="settings-display" class="settings-page" aria-labelledby="nav-display" data-settings-content="display" hidden>
        <h3 class="group-title" data-i18n="frameSettings"></h3>
        <form id="display-form" class="group picture-form">
          <fieldset id="display-fields">
            <button class="cell select-row" type="button" data-picker="ui-scale" aria-haspopup="dialog"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l4.2-11h1.6L13 18M5 14h5.6M13.5 18l3.1-8h1.2l3.2 8M15 15.3h4.3"/></svg></span><span class="main"><b data-i18n="ui"></b></span><span class="value"></span><span class="chev"></span></button><select id="ui-scale" hidden tabindex="-1"><option value="75" data-i18n="smaller"></option><option value="85" data-i18n="small"></option><option value="100" data-i18n="standard"></option><option value="115" data-i18n="large"></option></select>
            <button class="cell select-row" type="button" data-picker="fps" aria-haspopup="dialog"><span class="tile orange"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5a8 8 0 0 1 16 0"/><path d="M12 15.5l4.2-5.2"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg></span><span class="main"><b data-i18n="fps"></b></span><span class="value"></span><span class="chev"></span></button><select id="fps" hidden tabindex="-1"><option value="30">30 fps</option><option value="60">60 fps</option></select>
          </fieldset>
          <button id="apply" class="btn" type="submit" data-i18n="apply"></button>
          <p id="display-status" class="foot" role="status" aria-live="polite"></p>
        </form>
        <div class="group spaced"><button id="fullscreen" class="cell" type="button"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></span><span class="main"><b id="fullscreen-text"></b></span></button></div>
        <div class="group spaced"><details><summary class="cell"><span class="tile gray"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 6.2a4.2 4.2 0 0 0-5.3 5.3L4 16.8V20h3.2l5.3-5.3a4.2 4.2 0 0 0 5.3-5.3l-2.6 2.6-2.2-2.2z"/></svg></span><span class="main"><b data-i18n="advanced"></b></span><span class="chev"></span></summary><div class="inner advanced">
          <button class="cell select-row" type="button" data-picker="codec" aria-haspopup="dialog"><span class="tile purple"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7.5 5v14M16.5 5v14M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/></svg></span><span class="main"><b data-i18n="codec"></b></span><span class="value"></span><span class="chev"></span></button><select id="codec" hidden tabindex="-1"><option value="auto" data-i18n="codecAuto"></option><option value="h264">H.264</option><option value="h265">H.265</option></select>
          <label class="cell"><span class="tile red"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5.5 13.5H11l-1 7.5 8.5-11H13z"/></svg></span><span class="main"><b data-i18n="performanceMode"></b></span><input id="performance-mode" class="switch" type="checkbox"/></label>
<label class="cell"><span class="tile teal"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.8" height="6.8" rx="1.2"/><rect x="13.2" y="4" width="6.8" height="6.8" rx="1.2"/><rect x="4" y="13.2" width="6.8" height="6.8" rx="1.2"/><rect x="13.2" y="13.2" width="6.8" height="6.8" rx="1.2"/></svg></span><span class="main"><b data-i18n="allow2560"></b></span><input id="allow-2560" class="switch" type="checkbox"/></label>
<label class="cell"><span class="tile gray"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.2c0 4.6-3.2 8.1-7.5 9.8-4.3-1.7-7.5-5.2-7.5-9.8V6z"/><path d="M8.8 12.2l2.2 2.2 4.4-4.6"/></svg></span><span class="main"><b data-i18n="compatDisplay"></b></span><input id="compat-display-on" class="switch" type="checkbox"/></label>
<label class="cell"><span class="tile dark"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9.5l3 2.8-3 2.8M12.5 15.5H17"/></svg></span><span class="main"><b data-i18n="debugHud"></b></span><input id="debug-hud-on" class="switch" type="checkbox"/></label>
        </div></details></div>
      </section>
      <section id="settings-connection" class="settings-page" aria-labelledby="nav-connection" data-settings-content="connection" hidden>
        <h3 class="group-title" data-i18n="supportTab"></h3>
        <div class="group"><a id="box-link-panel" class="cell" href="/" hidden><span class="tile green"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.8 5.2h2.4"/></svg></span><span class="main"><b data-i18n="boxLink"></b></span><span class="chev"></span></a>
<details><summary class="cell"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-5.5 4 11 2.3-5.5H21"/></svg></span><span class="main"><b data-i18n="diagnostics"></b></span><span class="chev"></span></summary><div class="inner text"><p id="capabilities"></p><p id="stats"></p><button id="browser-check-show" class="btn plain" type="button" data-i18n="browserCheck"></button></div></details></div>
      </section>
    </div>
  </div>
</dialog>
<dialog id="picker" class="picker" aria-labelledby="picker-title"><h2 id="picker-title"></h2><div id="picker-options" class="options" role="listbox"></div><button id="picker-cancel" class="btn plain" type="button" data-i18n="cancel"></button></dialog>
<script type="module" src="/src/boot.ts"></script></body></html>
