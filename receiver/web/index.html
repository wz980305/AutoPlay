<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"/><meta name="color-scheme" content="dark"/><title>AutoPlay</title><script>(function(){try{var m=localStorage.getItem("f50-night-mode"),k=/^(\d{1,4}),(\d{1,4})$/.exec(localStorage.getItem("f50-sun-times")||""),d=new Date(),t=d.getHours()*60+d.getMinutes(),n=m==="night"||(m!=="day"&&(m==="system"?matchMedia("(prefers-color-scheme: dark)").matches:t>=(k?+k[2]:1110)||t<(k?+k[1]:390)));document.documentElement.setAttribute("data-theme",n?"dark":"light")}catch(e){}})()</script><link rel="stylesheet" href="/src/style.css"/><noscript><style>#browser-check{display:block!important}</style></noscript></head>
<body><section id="browser-check" class="bc" style="display:none" aria-labelledby="browser-check-title">
  <style>
   /* The browser check (1.6.0): drawn before the player bundle, so it carries its own few rules, the settings panel's
      look and its day and night (the <head> script has set data-theme). It shows when this browser cannot run the
      player, or from Settings > Connection > Compatibility check. */
   .bc{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;overflow:auto;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-size:20px;font-size:clamp(20px,2.78vmin,24px);line-height:1.45;--cell:#1C1C1E;--sep:rgba(84,84,88,.65);--sub:rgba(235,235,245,.6);--ok:#30D158;--bad:#FF4245;--warn:#FF9230}
   :root[data-theme=light] .bc{background:#F2F2F7;color:#000;--cell:#FFF;--sep:rgba(60,60,67,.29);--sub:rgba(60,60,67,.6);--ok:#34C759;--bad:#FF383C;--warn:#FF8D28}
   /* In em of the panel's root size (the bundle's style sheet may be what failed): the bar, the title, a row and its
      grey line measure what the settings panel's do. */
   .bc header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1em;min-height:calc(4.75em + 1px);padding:.75em max(1.5em,calc(50% - 720px + 1.5em));border-bottom:1px solid var(--sep);background:inherit;position:sticky;top:0}
   .bc h2{grid-column:2;grid-row:1;margin:0;font-size:1.6em;font-weight:600;line-height:1.3;text-align:center;white-space:nowrap}
   .bc header button{grid-column:1;grid-row:1;justify-self:start;display:inline-flex;align-items:center;justify-content:center;width:3.2em;height:3.2em;
    padding:0;border:0;border-radius:50%;background:var(--cell);color:inherit}
   .bc header button svg{width:1.45em;height:1.45em}
   .bc .bc-status{margin:.25em 0 0;color:inherit;font-size:1.2em;font-weight:600}
   .bc header button[hidden]{display:none}
   .bc .bc-body{max-width:44em;margin:0 auto;padding:1em 1.5em 1.5em}
   .bc p{margin:.5em 1em 0;color:var(--sub);overflow-wrap:anywhere}
   .bc p:empty{display:none}
   .bc ul{list-style:none;margin:1em 0 0;padding:0;border-radius:.75em;background:var(--cell);overflow:hidden}
   .bc ul:empty{display:none}
   .bc li{display:flex;align-items:center;gap:.625em;min-height:3em;padding:.625em .8333em;font-size:1.2em}
   .bc li+li{border-top:1px solid var(--sep)}
   .bc li b{flex:1;font-weight:400}
   .bc li span{color:var(--sub);white-space:nowrap}
   .bc li.ok span{color:var(--ok)}.bc li.missing span{color:var(--bad)}.bc li.limited span{color:var(--warn)}
   .bc li small{display:block;color:var(--sub);font-size:.8333em;margin-top:.2083em}
  </style>
  <header><button id="browser-check-continue" type="button" hidden aria-label="返回"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="browser-check-title">兼容性检测</h2></header>
  <div class="bc-body">
   <p id="browser-check-status" class="bc-status">正在检测 / Checking…</p>
   <p id="browser-check-note"></p>
   <noscript><p>此浏览器禁用了 JavaScript，无法使用 CarPlay。 / JavaScript is off in this browser; CarPlay cannot be shown.</p></noscript>
   <ul id="browser-check-list"></ul>
   <p id="browser-check-advice"></p>
   <p id="browser-check-agent"></p>
  </div>
</section><script src="./browser-check.js"></script><main id="app">
  <div id="screen-container"><div id="surface"><canvas id="screen" width="1280" height="720" aria-label="CarPlay" inert></canvas></div></div>
  <div id="overlay" role="status"><div class="welcome">

    <p class="status"><span class="spinner" aria-hidden="true"></span><span id="connection-text"></span></p>
    <p id="connection-hint"></p>
    <div class="group actions">

      <button id="welcome-fullscreen" class="cell" type="button"><span class="tile blue"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></span><span class="main"><b data-i18n="fullscreen"></b></span><span id="welcome-fullscreen-value" class="value"></span><span class="chev"></span></button>
    </div>
  </div></div>
  <div id="recovering" role="status" hidden><div class="notice"><span class="spinner" aria-hidden="true"></span><span id="recovering-text"></span></div></div>
  <div id="toast" class="capsule" role="status" hidden></div>
  <div id="debug-hud" aria-hidden="true" hidden></div>
</main>
